services:
  pgvector:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    container_name: pgvector-db-codecanvas
    environment:
      POSTGRES_DB: pgvector-test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test1234
    ports:
      - "9010:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql
    restart: unless-stopped


  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio-codecanvas
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: test
      MINIO_ROOT_PASSWORD: test1234
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  pgvector-data:
  minio-data: